name: Keep backend warm

# Pings the backend on a schedule so a sleeping free instance is more likely to
# be awake when a visitor arrives. This REDUCES the cold start; it does not
# remove it, because GitHub runs scheduled workflows on a best-effort basis and
# routinely delays them by hours under load.
#
# This step used to end in `|| true`, so the job reported success whether or
# not anything answered. The Fly deployment was suspended on 28 June and every
# run since then was still green. A check that cannot fail is worse than no
# check at all, because it is actively reassuring.
#
# It now fails when the backend does not answer. Alerting proper lives in
# Balisa50.github.io/.github/workflows/uptime.yml, which opens an issue; this
# one keeps the instance warm and goes red if that stops working.
#
# DISABLED as of 3 Sep 2026. There is currently no backend to warm: the Fly
# trial ended and the Render service is not running, so nova-backend answers
# nothing on either host. A warmer pointed at nothing is noise every fifteen
# minutes, not a signal. Re-enable it after redeploying:
#
#   gh variable set BACKEND_URL --repo Balisa50/nova --body "https://<service>.onrender.com"
#   gh workflow enable "Keep backend warm" --repo Balisa50/nova
#
# It is disabled rather than deleted, and it is deliberately still a check
# that can fail, which is the property that was fixed in June.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        env:
          # Set BACKEND_URL as a repository variable once the service is
          # redeployed. It falls back to the suspended Fly host so an unset
          # variable fails loudly rather than silently pinging nothing.
          BACKEND_URL: ${{ vars.BACKEND_URL || 'https://nova-backend.fly.dev' }}
        run: |
          # A sleeping free instance can take ~50s to wake, so allow 90 seconds
          # and retry once before calling it down.
          for attempt in 1 2; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 \
                     "${BACKEND_URL}/api/health" 2>/dev/null) || true
            [ -z "$code" ] && code="000"
            echo "attempt ${attempt}: ${code}"
            [ "$code" = "200" ] && exit 0
            [ "$attempt" = "1" ] && sleep 15
          done
          echo "Backend did not answer 200 at ${BACKEND_URL}/api/health"
          exit 1
