[pytest]
testpaths = tests
python_files = test_*.py
# The package lives at backend/synthfin, so backend/ has to be importable.
# `python -m pytest` puts the cwd on sys.path but the bare `pytest` console
# script does not, which is why CI failed where the local run passed.
pythonpath = .
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
